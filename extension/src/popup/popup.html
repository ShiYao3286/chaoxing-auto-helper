<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 292px;
    font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1f2328; background: #fff;
  }
  .hd {
    background: linear-gradient(135deg, #2d6cdf, #3f8cff);
    color: #fff; padding: 12px 14px;
  }
  .hd .t { font-weight: 700; font-size: 14px; }
  .hd .s { font-size: 11px; opacity: .88; margin-top: 2px; }

  .bd { padding: 12px 14px; }

  .stat {
    display: flex; align-items: center; gap: 8px;
    background: #f6f8fa; border: 1px solid #eaedf0; border-radius: 8px;
    padding: 9px 11px; margin-bottom: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b949e; flex: 0 0 auto; }
  .dot.on { background: #2da44e; box-shadow: 0 0 0 3px rgba(45,164,78,.15); }
  .stat .txt { font-size: 12px; color: #57606a; flex: 1; }
  .stat .txt b { color: #1f2328; }

  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .row label { color: #424a53; cursor: pointer; }
  input[type=number] {
    width: 62px; padding: 3px 6px; border: 1px solid #d0d7de;
    border-radius: 5px; font-size: 12px;
  }
  input[type=checkbox] { transform: scale(1.12); accent-color: #2d6cdf; cursor: pointer; }

  .btns { display: flex; gap: 7px; margin-top: 12px; }
  button {
    flex: 1; padding: 8px 0; border: 0; border-radius: 7px;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: .15s;
  }
  .start { background: #2d6cdf; color: #fff; }
  .start:hover { background: #255bbd; }
  .stop { background: #e5484d; color: #fff; }
  .stop:hover { background: #cf3c41; }
  .opt { background: #f0f3f6; color: #424a53; }
  .opt:hover { background: #e4e9ee; }

  .tip { font-size: 11px; color: #8b949e; margin-top: 10px; line-height: 1.5; }
  .warn {
    font-size: 11px; color: #8a5300; background: #fff4e5;
    border: 1px solid #ffe1b8; border-radius: 6px;
    padding: 7px 9px; margin-top: 10px; line-height: 1.5;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="hd">
  <div class="t">学习通自动学习</div>
  <div class="s" id="host">未检测到页面</div>
</div>

<div class="bd">

  <div class="stat">
    <span class="dot" id="dot"></span>
    <div class="txt">状态：<b id="status">待机</b></div>
  </div>

  <div class="row"><label for="p-rate">倍速</label>
    <input type="number" id="p-rate" step="0.25" min="1" max="4"></div>
  <div class="row"><label for="p-mute">静音</label>
    <input type="checkbox" id="p-mute"></div>
  <div class="row"><label for="p-next">自动下一节</label>
    <input type="checkbox" id="p-next"></div>
  <div class="row"><label for="p-quiz">自动作答</label>
    <input type="checkbox" id="p-quiz"></div>

  <div class="btns">
    <button class="start" id="btnStart">开始</button>
    <button class="stop" id="btnStop">停止</button>
  </div>
  <div class="btns">
    <button class="opt" id="btnOptions">设置（API）</button>
  </div>

  <div class="warn" id="apiWarn">
    ⚠ 尚未配置答题 API，章节测验不会自动作答。
  </div>

  <div class="tip">面板也会显示在学习通页面右下角，可拖动。</div>

</div>

<script src="popup.js"></script>
</body>
</html>
